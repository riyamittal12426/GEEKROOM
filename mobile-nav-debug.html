<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Navigation Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding-top: 80px;
        }
        
        .debug-info {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.8);
            padding: 5px 10px;
            font-size: 12px;
            z-index: 2000;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 0;
            position: fixed;
            top: 25px;
            width: 100%;
            z-index: 999;
            backdrop-filter: blur(20px);
            border: 1px solid #333;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo a {
            color: #A0FF8F;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 2rem;
        }
        
        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: all 0.3s;
            border-radius: 4px;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #A0FF8F;
            background: rgba(160, 255, 143, 0.1);
        }
        
        .nav-hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 12px;
            background: rgba(160, 255, 143, 0.2);
            border: 2px solid #A0FF8F;
            border-radius: 6px;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            user-select: none;
            position: relative;
            z-index: 1001;
        }
        
        .nav-hamburger:active {
            background: rgba(160, 255, 143, 0.4);
            transform: scale(0.95);
        }
        
        .nav-hamburger .bar {
            display: block;
            width: 28px;
            height: 4px;
            background-color: #A0FF8F;
            margin: 3px 0;
            transition: 0.3s;
            border-radius: 3px;
            box-shadow: 0 0 5px rgba(160, 255, 143, 0.3);
        }
        
        /* Mobile styles */
        @media (max-width: 768px) {
            .nav-menu {
                position: fixed;
                left: -100%;
                top: 95px;
                flex-direction: column;
                background-color: rgba(0, 0, 0, 0.95);
                width: 100%;
                text-align: center;
                transition: 0.3s;
                backdrop-filter: blur(20px);
                padding: 2rem 0;
                border: 1px solid #333;
            }
            
            .nav-menu.active {
                left: 0;
            }
            
            .nav-menu li {
                margin: 1rem 0;
            }
            
            .nav-hamburger {
                display: flex !important;
            }
            
            .nav-hamburger.active .bar:nth-child(2) {
                opacity: 0;
            }
            
            .nav-hamburger.active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }
            
            .nav-hamburger.active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }
        }
        
        .content {
            padding: 2rem;
            text-align: center;
        }
        
        .test-buttons {
            margin: 2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        .test-btn {
            background: #A0FF8F;
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            min-width: 200px;
        }
        
        .test-btn:active {
            transform: scale(0.95);
        }
        
        .status {
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(160, 255, 143, 0.1);
            border-radius: 8px;
            border: 1px solid #A0FF8F;
        }
    </style>
</head>
<body>
    <div class="debug-info" id="debug-info">
        Loading debug info...
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#">Geek Room Debug</a>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Events</a></li>
                <li><a href="#" class="nav-link active">Team</a></li>
                <li><a href="#" class="nav-link">Gallery</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-hamburger" id="nav-hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1>🍔 Mobile Navigation Test</h1>
        <p>This page tests the hamburger menu on mobile devices.</p>
        
        <div class="status">
            <h3>Test Status:</h3>
            <div id="test-status">Initializing...</div>
        </div>
        
        <div class="test-buttons">
            <button class="test-btn" onclick="testHamburger()">Test Hamburger Click</button>
            <button class="test-btn" onclick="toggleMenu()">Toggle Menu Manually</button>
            <button class="test-btn" onclick="showDebugInfo()">Show Debug Info</button>
        </div>
        
        <div id="debug-output" style="margin-top: 2rem; font-family: monospace; font-size: 12px; text-align: left;"></div>
    </div>

    <script>
        let clickCount = 0;
        
        function updateDebugInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            const hamburgerVisible = window.getComputedStyle(hamburger).display !== 'none';
            const menuActive = navMenu.classList.contains('active');
            
            document.getElementById('debug-info').innerHTML = `
                📱 ${width}×${height} | 🍔 ${hamburgerVisible ? 'VISIBLE' : 'HIDDEN'} | 📋 ${menuActive ? 'OPEN' : 'CLOSED'} | Clicks: ${clickCount}
            `;
            
            document.getElementById('test-status').innerHTML = `
                <strong>Screen Size:</strong> ${width} × ${height}px<br>
                <strong>Hamburger Visible:</strong> ${hamburgerVisible ? '✅ YES' : '❌ NO'}<br>
                <strong>Menu Status:</strong> ${menuActive ? '🟢 OPEN' : '🔴 CLOSED'}<br>
                <strong>Click Count:</strong> ${clickCount}
            `;
        }
        
        function testHamburger() {
            const hamburger = document.getElementById('nav-hamburger');
            hamburger.click();
            clickCount++;
            updateDebugInfo();
        }
        
        function toggleMenu() {
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
            
            updateDebugInfo();
        }
        
        function showDebugInfo() {
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            const debugInfo = {
                'Hamburger Element': hamburger ? 'Found' : 'NOT FOUND',
                'NavMenu Element': navMenu ? 'Found' : 'NOT FOUND',
                'Hamburger Display': hamburger ? window.getComputedStyle(hamburger).display : 'N/A',
                'Hamburger Position': hamburger ? window.getComputedStyle(hamburger).position : 'N/A',
                'NavMenu Left': navMenu ? window.getComputedStyle(navMenu).left : 'N/A',
                'Touch Events': 'ontouchstart' in window ? 'Supported' : 'Not Supported',
                'User Agent': navigator.userAgent
            };
            
            document.getElementById('debug-output').innerHTML = 
                '<h3>Debug Information:</h3>' +
                Object.entries(debugInfo).map(([key, value]) => 
                    `<strong>${key}:</strong> ${value}<br>`
                ).join('');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🍔 Debug page loaded');
            
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    clickCount++;
                    console.log('🍔 Hamburger clicked! Count:', clickCount);
                    
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('active');
                    
                    updateDebugInfo();
                });
                
                // Touch events for better mobile support
                hamburger.addEventListener('touchstart', function(e) {
                    console.log('👆 Touch start on hamburger');
                });
                
                hamburger.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('👆 Touch end on hamburger');
                });
            }
            
            // Initial update
            updateDebugInfo();
            
            // Update on resize
            window.addEventListener('resize', updateDebugInfo);
            
            console.log('✅ Debug script initialized');
        });
    </script>
</body>
</html>
