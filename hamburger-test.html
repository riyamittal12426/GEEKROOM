<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
            backdrop-filter: blur(20px);
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo a {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .accent {
            color: #A0FF8F;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 2rem;
        }
        
        .nav-link {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #A0FF8F;
        }
        
        .nav-hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 8px;
            background: rgba(160, 255, 143, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(160, 255, 143, 0.3);
        }
        
        .nav-hamburger .bar {
            display: block;
            width: 25px;
            height: 3px;
            background-color: #A0FF8F;
            margin: 3px 0;
            transition: 0.3s;
            border-radius: 2px;
        }
        
        /* Mobile styles */
        @media (max-width: 992px) {
            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: rgba(0, 0, 0, 0.95);
                width: 100%;
                text-align: center;
                transition: 0.3s;
                backdrop-filter: blur(20px);
                padding: 2rem 0;
            }
            
            .nav-menu.active {
                left: 0;
            }
            
            .nav-menu li {
                margin: 1rem 0;
            }
            
            .nav-hamburger {
                display: flex !important;
            }
            
            .nav-hamburger.active .bar:nth-child(2) {
                opacity: 0;
            }
            
            .nav-hamburger.active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }
            
            .nav-hamburger.active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }
        }
        
        /* Test content */
        .test-content {
            margin-top: 100px;
            padding: 2rem;
            text-align: center;
        }
        
        .device-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(160, 255, 143, 0.9);
            color: #000;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#"><span class="accent">Geek Room</span> <span class="white-text">Adgips</span></a>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Events</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active">Team</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="nav-hamburger" id="nav-hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="test-content">
        <h1>Hamburger Menu Test</h1>
        <p>Resize your browser window or use mobile view to test the hamburger menu.</p>
        <p>The hamburger should appear at 992px and below.</p>
        
        <div style="margin-top: 2rem;">
            <h2>Current Status:</h2>
            <div id="status">Testing...</div>
        </div>
    </div>
    
    <div class="device-info" id="device-info">
        Loading...
    </div>

    <script>
        // Mobile menu toggle
        const hamburger = document.getElementById('nav-hamburger');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking on a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });

        // Update device info
        function updateDeviceInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const hamburgerVisible = window.getComputedStyle(hamburger).display !== 'none';
            
            document.getElementById('device-info').innerHTML = `
                Screen: ${width}×${height}<br>
                Hamburger: ${hamburgerVisible ? 'VISIBLE' : 'HIDDEN'}
            `;
            
            document.getElementById('status').innerHTML = `
                <strong>Screen Width:</strong> ${width}px<br>
                <strong>Hamburger Menu:</strong> ${hamburgerVisible ? '✅ VISIBLE' : '❌ HIDDEN'}<br>
                <strong>Expected:</strong> ${width <= 992 ? 'Should be VISIBLE' : 'Should be HIDDEN'}
            `;
        }

        // Initial update and on resize
        updateDeviceInfo();
        window.addEventListener('resize', updateDeviceInfo);
        
        console.log('🍔 Hamburger menu test loaded');
    </script>
</body>
</html>
