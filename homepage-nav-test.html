<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Navigation Test</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .debug-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #ff0000;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            z-index: 9999;
            text-align: center;
        }
        
        body {
            padding-top: 30px;
        }
        
        .test-content {
            padding: 100px 20px 20px;
            text-align: center;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }
        
        .status-card {
            background: rgba(160, 255, 143, 0.1);
            border: 1px solid #A0FF8F;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
        }
        
        .test-btn {
            background: #A0FF8F;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .test-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="debug-banner" id="debug-banner">
        Homepage Navigation Test - Loading...
    </div>

    <!-- Copy of homepage navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">
                    <span class="accent">Geek Room</span> <span class="white-text">Adgips</span>
                </a>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link active">Home</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link">Events</a>
                </li>
                <li class="nav-item">
                    <a href="team.html" class="nav-link">Team</a>
                </li>
                <li class="nav-item">
                    <a href="gallery.html" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="nav-hamburger" id="nav-hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="test-content">
        <h1>🏠 Homepage Navigation Test</h1>
        <p>This page tests the hamburger menu using the same styles as the homepage.</p>
        
        <div class="status-card">
            <h3>Status Information</h3>
            <div id="status-info">Loading...</div>
        </div>
        
        <div>
            <button class="test-btn" onclick="testHamburger()">Test Hamburger</button>
            <button class="test-btn" onclick="toggleMenu()">Force Toggle</button>
            <button class="test-btn" onclick="showDebugInfo()">Debug Info</button>
            <button class="test-btn" onclick="location.href='index.html'">Go to Homepage</button>
        </div>
        
        <div id="debug-output" style="margin-top: 20px; font-family: monospace; font-size: 12px; text-align: left; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 5px;"></div>
    </div>

    <script>
        let clickCount = 0;
        
        function updateStatus() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            if (!hamburger || !navMenu) {
                document.getElementById('debug-banner').textContent = 'ERROR: Elements not found!';
                return;
            }
            
            const hamburgerVisible = window.getComputedStyle(hamburger).display !== 'none';
            const menuActive = navMenu.classList.contains('active');
            
            document.getElementById('debug-banner').innerHTML = `
                📱 ${width}×${height} | 🍔 ${hamburgerVisible ? 'VISIBLE' : 'HIDDEN'} | 📋 ${menuActive ? 'OPEN' : 'CLOSED'} | Clicks: ${clickCount}
            `;
            
            document.getElementById('status-info').innerHTML = `
                <strong>Screen Size:</strong> ${width} × ${height}px<br>
                <strong>Hamburger Visible:</strong> ${hamburgerVisible ? '✅ YES' : '❌ NO'}<br>
                <strong>Expected (≤992px):</strong> ${width <= 992 ? '✅ Should Show' : '❌ Should Hide'}<br>
                <strong>Menu Status:</strong> ${menuActive ? '🟢 OPEN' : '🔴 CLOSED'}<br>
                <strong>Hamburger Display CSS:</strong> ${window.getComputedStyle(hamburger).display}<br>
                <strong>Click Count:</strong> ${clickCount}
            `;
        }
        
        function testHamburger() {
            const hamburger = document.getElementById('nav-hamburger');
            if (hamburger) {
                hamburger.click();
                clickCount++;
                updateStatus();
            }
        }
        
        function toggleMenu() {
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            if (hamburger && navMenu) {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
                updateStatus();
            }
        }
        
        function showDebugInfo() {
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            const debugInfo = {
                'Hamburger Found': hamburger ? '✅ Yes' : '❌ No',
                'NavMenu Found': navMenu ? '✅ Yes' : '❌ No',
                'Hamburger Display': hamburger ? window.getComputedStyle(hamburger).display : 'N/A',
                'Hamburger Position': hamburger ? window.getComputedStyle(hamburger).position : 'N/A',
                'Hamburger Z-Index': hamburger ? window.getComputedStyle(hamburger).zIndex : 'N/A',
                'NavMenu Left': navMenu ? window.getComputedStyle(navMenu).left : 'N/A',
                'Touch Support': 'ontouchstart' in window ? '✅ Yes' : '❌ No',
                'Screen Width': window.innerWidth + 'px',
                'User Agent': navigator.userAgent.substring(0, 80) + '...'
            };
            
            document.getElementById('debug-output').innerHTML = 
                '<h3>🔍 Debug Information:</h3>' +
                Object.entries(debugInfo).map(([key, value]) => 
                    `<strong>${key}:</strong> ${value}<br>`
                ).join('');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏠 Homepage nav test loaded');
            
            const hamburger = document.getElementById('nav-hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            if (hamburger && navMenu) {
                // Primary click handler
                hamburger.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    clickCount++;
                    console.log('🍔 Hamburger clicked! Count:', clickCount);
                    
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('active');
                    
                    updateStatus();
                });
                
                // Touch handlers
                hamburger.addEventListener('touchstart', function(e) {
                    console.log('👆 Touch start');
                });
                
                hamburger.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('👆 Touch end');
                });
                
                // Nav link handlers
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', function() {
                        hamburger.classList.remove('active');
                        navMenu.classList.remove('active');
                        updateStatus();
                    });
                });
            } else {
                console.error('❌ Hamburger or navMenu not found!');
            }
            
            // Initial status update
            updateStatus();
            
            // Update on resize
            window.addEventListener('resize', updateStatus);
            
            console.log('✅ Test page initialized');
        });
    </script>
</body>
</html>
