<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Events Navigation</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
        }
        .test-container { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .test-button { 
            background: #A0FF8F; 
            color: #000; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            margin: 5px; 
            cursor: pointer; 
        }
        .test-result { 
            background: #333; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { 
            border-left: 4px solid #4CAF50; 
        }
        .error { 
            border-left: 4px solid #f44336; 
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Events Navigation Test</h1>
        <p>This page tests if the events navigation is working correctly.</p>
        
        <div>
            <button class="test-button" onclick="testEventsPage()">Test Events Page</button>
            <button class="test-button" onclick="testUpcomingEvents()">Test Upcoming Events Link</button>
            <button class="test-button" onclick="testPastEvents()">Test Past Events Link</button>
        </div>
        
        <div id="test-results"></div>
    </div>

    <script>
        function addResult(message, isSuccess = true) {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(resultDiv);
        }

        function testEventsPage() {
            addResult('🔗 Opening events page...');
            window.open('events.html', '_blank');
        }

        function testUpcomingEvents() {
            addResult('🔗 Testing upcoming events navigation...');
            window.open('events.html#upcoming-events', '_blank');
        }

        function testPastEvents() {
            addResult('🔗 Testing past events navigation...');
            window.open('events.html#past-events', '_blank');
        }

        // Test on page load
        window.addEventListener('load', function() {
            addResult('✅ Test page loaded successfully');
            addResult('📋 Ready to test events navigation functionality');
        });
    </script>
</body>
</html>
